apiVersion: v1
kind: ConfigMap
metadata:
  name: kiali
  namespace: istio-system
data:
  config.yaml: |
    auth:
      strategy: anonymous
    deployment:
      accessible_namespaces:
      - '**'
    external_services:
      prometheus:
        url: http://10.244.0.13:9090
      grafana:
        enabled: true
        url: http://grafana:3000
      tracing:
        enabled: true
    server:
      port: 20001
      web_root: /kiali