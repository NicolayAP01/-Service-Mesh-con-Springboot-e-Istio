apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-service
  template:
    metadata:
      labels:
        app: customer-service
    spec:
      containers:
      - name: customer-service
        image: customer-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8081
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:mysql://mysql:3306/orders?serverTimezone=GMT-5"
        - name: SPRING_DATASOURCE_USERNAME
          value: "orders"
        - name: SPRING_DATASOURCE_PASSWORD
          value: "uptc2026"
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS 
          value: "kafka:9092"   
---
apiVersion: v1
kind: Service
metadata:
  name: customer-service
spec:
  selector:
    app: customer-service
  ports:
  - port: 8081
    targetPort: 8081